version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: crypto_analyzer_db
    environment:
      POSTGRES_DB: crypto_analyzer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password_here
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pg_data: